name: Deploy to Pluto

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + compile)
        run: npm run build

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.PLUTO_SSH_KEY }}
          PLUTO_HOST: ${{ secrets.PLUTO_HOST }}
          PLUTO_USER: ${{ secrets.PLUTO_USER }}
        run: |
          set -e
          [ -n "$PLUTO_HOST" ] || { echo "::error::PLUTO_HOST secret is empty"; exit 11; }
          [ -n "$PLUTO_USER" ] || { echo "::error::PLUTO_USER secret is empty"; exit 12; }
          [ -n "$SSH_KEY" ]    || { echo "::error::PLUTO_SSH_KEY secret is empty"; exit 13; }
          echo "Secret lengths — host=${#PLUTO_HOST} user=${#PLUTO_USER} key=${#SSH_KEY}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Validate key parses
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::Private key is malformed (ssh-keygen could not parse it)"
            exit 14
          fi
          echo "Key parsed OK; first line: $(head -n1 ~/.ssh/id_deploy)"
          # Resolve host via keyscan
          if ! ssh-keyscan -H "$PLUTO_HOST" > ~/.ssh/known_hosts 2> /tmp/keyscan.err; then
            echo "::error::ssh-keyscan failed:"
            cat /tmp/keyscan.err
            exit 15
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::known_hosts empty after keyscan — host did not respond"
            cat /tmp/keyscan.err
            exit 16
          fi
          echo "known_hosts lines: $(wc -l < ~/.ssh/known_hosts)"

      - name: Sync source + dist to Pluto
        env:
          REMOTE: ${{ secrets.PLUTO_USER }}@${{ secrets.PLUTO_HOST }}:/home/softwerks/domains/goby.softwerks.pro/goby/
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='.env' \
            --exclude='knowledge/*' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "$REMOTE"

      - name: Install runtime deps + restart service
        env:
          REMOTE_HOST: ${{ secrets.PLUTO_USER }}@${{ secrets.PLUTO_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$REMOTE_HOST" \
            'cd /home/softwerks/domains/goby.softwerks.pro/goby && \
             npm ci --omit=dev && \
             sudo systemctl restart goby && \
             sleep 2 && \
             sudo systemctl is-active goby'

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://goby.softwerks.pro/health; then
              echo
              echo "Deploy verified."
              exit 0
            fi
            echo "Health check attempt $i failed; retrying..."
            sleep 2
          done
          echo "Health check never returned 200."
          exit 1
