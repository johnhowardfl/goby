# Drop into the SSL <VirtualHost> for goby.softwerks.pro in Virtualmin.
# Requires mod_proxy and mod_proxy_http.

ProxyPreserveHost On
ProxyPass / http://127.0.0.1:3001/ retry=0 timeout=120
ProxyPassReverse / http://127.0.0.1:3001/

# Disable buffering on streaming endpoints so SSE deltas reach the browser immediately.
<LocationMatch "^/api/chat/conversations/[0-9]+/message$">
  SetEnv proxy-sendchunked 1
  SetEnv no-gzip 1
</LocationMatch>
